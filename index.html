<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Million Cloud Download</title>
<meta name="description" content="Download the Million Cloud test app for Android. 下载 Million Cloud 安卓测试版。">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --ground: #F7F8FA; --surface: #FFFFFF; --sunk: #EDEFF3; --line: #DDE1E8;
    --ink: #141A24; --ink-mid: #4A5566; --ink-soft: #78849A;
    --accent: #2E6BE6; --accent-ink: #FFFFFF; --accent-soft: #E6EDFC;
    --warn: #8A5A12; --warn-soft: #FBF2E0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1420; --surface: #161E2C; --sunk: #1C2534; --line: #2A3446;
      --ink: #EEF1F6; --ink-mid: #A6B1C2; --ink-soft: #7D899C;
      --accent: #5B8DEF; --accent-ink: #0E1420; --accent-soft: #1D2A44;
      --warn: #E8B56A; --warn-soft: #2E2717;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E1420; --surface: #161E2C; --sunk: #1C2534; --line: #2A3446;
    --ink: #EEF1F6; --ink-mid: #A6B1C2; --ink-soft: #7D899C;
    --accent: #5B8DEF; --accent-ink: #0E1420; --accent-soft: #1D2A44;
    --warn: #E8B56A; --warn-soft: #2E2717;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header img { width: 52px; height: 52px; border-radius: 12px; }
  header h1 { font-size: 20px; margin: 0; line-height: 1.2; }
  header p { margin: 2px 0 0; color: var(--ink-soft); font-size: 14px; }
  .lang {
    margin-left: auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 17px; margin: 0 0 12px; }
  .version { font-size: 28px; font-weight: 700; margin: 0; }
  .meta { color: var(--ink-soft); font-size: 14px; margin: 2px 0 16px; }
  .btn {
    display: block; text-align: center; text-decoration: none; background: var(--accent); color: var(--accent-ink);
    font-weight: 600; font-size: 18px; padding: 15px; border-radius: 12px;
  }
  .btn:focus-visible, .lang:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .note { border-radius: 12px; padding: 12px 14px; font-size: 15px; margin-top: 14px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.info { background: var(--accent-soft); color: var(--ink); }
  #qr-wrap { display: none; text-align: center; margin-top: 16px; }
  #qr { display: inline-block; padding: 12px; background: #fff; border-radius: 12px; }
  #qr img, #qr canvas { display: block; }
  #qr-wrap p { color: var(--ink-mid); font-size: 14px; margin: 8px 0 0; }
  ol.steps { margin: 0; padding-left: 22px; }
  ol.steps li { margin-bottom: 10px; }
  ol.steps li:last-child { margin-bottom: 0; }
  .muted { color: var(--ink-mid); font-size: 14px; }
  details { border-top: 1px solid var(--line); padding: 12px 0 0; margin-top: 12px; }
  details:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  summary { cursor: pointer; font-weight: 600; }
  summary .date { color: var(--ink-soft); font-weight: 400; font-size: 14px; }
  .notes { font-size: 15px; }
  .notes ul { padding-left: 20px; margin: 6px 0 10px; }
  .notes li { margin-bottom: 4px; }
  .notes p { margin: 10px 0 4px; }
  .notes a { color: var(--accent); }
  footer { color: var(--ink-soft); font-size: 13px; text-align: center; margin-top: 24px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.png" alt="">
    <div>
      <h1>Million Cloud</h1>
      <p data-t="subtitle"></p>
    </div>
    <button class="lang" id="lang" type="button"></button>
  </header>

  <section class="card" aria-live="polite">
    <p class="version" id="version">…</p>
    <p class="meta" id="meta" data-t="loading"></p>
    <a class="btn" id="download" href="https://github.com/sheng0716/million-cloud-releases/releases/latest" data-t="download"></a>
    <div class="note warn" id="ios-note" hidden data-t="iosNote"></div>
    <div id="qr-wrap">
      <div id="qr"></div>
      <p data-t="qrHint"></p>
    </div>
  </section>

  <section class="card">
    <h2 data-t="installTitle"></h2>
    <ol class="steps">
      <li data-t="step1"></li>
      <li data-t="step2"></li>
      <li data-t="step3"></li>
      <li data-t="step4"></li>
    </ol>
    <div class="note info" data-t="updateNote"></div>
  </section>

  <section class="card">
    <h2 data-t="aboutTitle"></h2>
    <p class="muted" style="margin:0" data-t="about"></p>
  </section>

  <section class="card">
    <h2 data-t="changesTitle"></h2>
    <div id="changes" class="notes"><p class="muted" data-t="loading"></p></div>
  </section>

  <footer>
    <a href="https://github.com/sheng0716/million-cloud-releases/releases" data-t="allReleases"></a>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var REPO = 'sheng0716/million-cloud-releases';
  var T = {
    en: {
      subtitle: 'Android test version',
      switchTo: '中文',
      loading: 'Loading…',
      download: 'Download for Android',
      downloadFallback: 'Open the download page',
      iosNote: 'This app is only for Android phones for now. It can’t be installed on an iPhone.',
      qrHint: 'On a computer? Scan this with your Android phone’s camera to download it there.',
      installTitle: 'How to install',
      step1: 'Tap <b>Download for Android</b> above. If your browser asks, choose <b>Download anyway</b>.',
      step2: 'When the download finishes, tap the file to open it (or find it in the <b>Downloads</b> app).',
      step3: 'If Android says it can’t install apps from this source, tap <b>Settings</b>, turn on <b>Allow from this source</b>, then go back.',
      step4: 'Tap <b>Install</b>. If Google Play Protect warns you, tap <b>More details</b> → <b>Install anyway</b>. This is normal for test apps that aren’t on the Play Store yet.',
      updateNote: 'Already have the app? Just install the new version over it. You don’t need to uninstall first, and you’ll stay signed in.',
      aboutTitle: 'Before you start',
      about: 'Sign in with your normal Million Cloud account. The app connects to the live server and shows your real company data, but it is read-only: it can’t change anything.',
      changesTitle: 'What’s new',
      changesError: 'Couldn’t load the release notes. Please try again later.',
      released: 'Released',
      allReleases: 'All versions on GitHub'
    },
    zh: {
      subtitle: '安卓测试版',
      switchTo: 'English',
      loading: '加载中…',
      download: '下载安卓版',
      downloadFallback: '打开下载页面',
      iosNote: '这个 app 目前只支持安卓手机，不能在 iPhone 上安装。',
      qrHint: '在电脑上打开的？用安卓手机的相机扫描这个二维码，在手机上下载。',
      installTitle: '安装步骤',
      step1: '点上面的<b>下载安卓版</b>。如果浏览器询问，选择<b>仍然下载</b>。',
      step2: '下载完成后，点一下文件打开（也可以在手机的<b>下载</b>或<b>文件管理</b>里找到它）。',
      step3: '如果安卓提示不能安装来自这个来源的应用，点<b>设置</b>，打开<b>允许来自此来源的应用</b>，然后返回。',
      step4: '点<b>安装</b>。如果 Google Play 保护机制出现警告，点<b>更多详情</b> → <b>仍然安装</b>。还没上架 Play 商店的测试版都会这样，属于正常情况。',
      updateNote: '已经装过了？直接安装新版本覆盖就可以，不用先卸载，也不用重新登录。',
      aboutTitle: '使用前须知',
      about: '请用你平时的 Million Cloud 账号登录。app 连接的是正式服务器，显示的是公司的真实数据，但它是只读的，不能修改任何内容。',
      changesTitle: '更新内容',
      changesError: '无法加载更新内容，请稍后再试。',
      released: '发布于',
      allReleases: '在 GitHub 上查看所有版本'
    }
  };

  function readLang() {
    try {
      var q = new URLSearchParams(location.search).get('lang');
      if (q === 'en' || q === 'zh') return q;
      var saved = localStorage.getItem('lang');
      if (saved === 'en' || saved === 'zh') return saved;
    } catch (e) {}
    return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
  }

  var lang = readLang();
  var release = null;
  var changelog = null;
  var apiFailed = false;
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  function renderStatic() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var key = el.getAttribute('data-t');
      if (key === 'download' && apiFailed) key = 'downloadFallback';
      if (key === 'loading' && el.id === 'meta' && (release || apiFailed)) {
        if (apiFailed) el.textContent = '';
        return;
      }
      el.innerHTML = T[lang][key];
    });
    document.getElementById('lang').textContent = T[lang].switchTo;
    renderRelease();
    renderChanges();
  }

  function renderRelease() {
    if (!release) return;
    var apk = (release.assets || []).filter(function (a) { return /\.apk$/i.test(a.name); })[0];
    document.getElementById('version').textContent = release.tag_name;
    var parts = [T[lang].released + ' ' + (release.published_at || '').slice(0, 10)];
    if (apk) parts.push((apk.size / 1048576).toFixed(0) + ' MB');
    document.getElementById('meta').textContent = parts.join(' · ');
    if (apk) document.getElementById('download').href = apk.browser_download_url;
  }

  // Chinese lines are hard-wrapped in CHANGELOG.md; joining them stops a stray space appearing mid-sentence.
  function joinCjkLines(md) {
    return md.replace(/([　-鿿＀-￯])\n[ \t]*([　-鿿＀-￯])/g, '$1$2');
  }

  function renderChanges() {
    var box = document.getElementById('changes');
    if (changelog === null) return;
    if (changelog === false) { box.innerHTML = '<p class="muted">' + T[lang].changesError + '</p>'; return; }
    var wanted = lang === 'zh' ? '中文' : 'English';
    var blocks = changelog.split(/^## /m).slice(1);
    var html = blocks.map(function (block, i) {
      var nl = block.indexOf('\n');
      var title = block.slice(0, nl).trim();
      var body = block.slice(nl + 1);
      var section = body.split(/^### /m).filter(function (p) {
        return p.split('\n')[0].trim() === wanted;
      })[0];
      var md = section ? section.slice(section.indexOf('\n') + 1) : body;
      var m = title.match(/^(\S+)\s*\((.*)\)$/);
      var head = m ? escapeHtml(m[1]) + ' <span class="date">' + escapeHtml(m[2]) + '</span>' : escapeHtml(title);
      return '<details' + (i === 0 ? ' open' : '') + '><summary>' + head + '</summary>' +
        window.marked.parse(joinCjkLines(md)) + '</details>';
    }).join('');
    box.innerHTML = html;
  }

  document.getElementById('lang').addEventListener('click', function () {
    lang = lang === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem('lang', lang); } catch (e) {}
    renderStatic();
  });

  if (isIOS) {
    document.getElementById('ios-note').hidden = false;
  } else if (!isAndroid) {
    document.getElementById('qr-wrap').style.display = 'block';
    try {
      new QRCode(document.getElementById('qr'), {
        text: location.href.split('#')[0].split('?')[0], width: 180, height: 180,
        colorDark: '#141A24', colorLight: '#FFFFFF'
      });
    } catch (e) { document.getElementById('qr-wrap').style.display = 'none'; }
  }

  renderStatic();

  fetch('https://api.github.com/repos/' + REPO + '/releases/latest', { headers: { Accept: 'application/vnd.github+json' } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) { release = data; renderStatic(); })
    .catch(function () {
      apiFailed = true;
      document.getElementById('version').textContent = 'Million Cloud';
      document.getElementById('meta').textContent = '';
      renderStatic();
    });

  fetch('CHANGELOG.md', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (text) { changelog = text.replace(/\r\n/g, '\n'); renderChanges(); })
    .catch(function () { changelog = false; renderChanges(); });
})();
</script>
</body>
</html>
